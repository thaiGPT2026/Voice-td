name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén dự án Android
        run: |
          rm -rf android
          unzip -q *.zip
          chmod +x android/gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Đổi tên APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TrangThaiKhongKhi.apk

      - name: Đưa APK lên mục Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Trạng thái không khí v1.0.${{ github.run_number }}
          files: TrangThaiKhongKhi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TrangThaiKhongKhi-apk
          path: TrangThaiKhongKhi.apk

