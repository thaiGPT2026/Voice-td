<title>Trạng thái không khí</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Bố cục: một cột kiểu dụng cụ đo — ô nhập ở trên, nút nói to ở giữa, bảng kết quả + biểu đồ i-d ở dưới */
:root{
  --bg:#f3f5f6; --card:#ffffff; --fg:#17212b; --muted:#5d6b77; --line:#d6dde3;
  --accent:#0d7a8a; --accent-ink:#ffffff; --accent-soft:#dcf0f3;
  --warn:#b4541a; --warn-soft:#fbe9dd;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --card:#18222a; --fg:#e8edf0; --muted:#97a6b2; --line:#2b3942;
  --accent:#4fc3d2; --accent-ink:#06282e; --accent-soft:#163b42;
  --warn:#f0a06a; --warn-soft:#3d2615; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --card:#18222a; --fg:#e8edf0; --muted:#97a6b2; --line:#2b3942;
  --accent:#4fc3d2; --accent-ink:#06282e; --accent-soft:#163b42;
  --warn:#f0a06a; --warn-soft:#3d2615; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font-body)}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
h1{font-size:1.25rem;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.brand{display:block;background:#fff;border-radius:10px;padding:8px 12px;width:max-content;max-width:100%;box-sizing:border-box;margin-bottom:10px;border:1px solid var(--line)}
.brand img{display:block;width:220px;max-width:100%;height:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
label{display:block;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
input,select{width:100%;box-sizing:border-box;font:inherit;font-family:var(--font-mono);font-size:1.05rem;padding:9px 10px;
  border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{font:inherit;font-weight:500;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.mic{flex:1 1 100%;font-size:1.1rem;padding:16px;display:flex;align-items:center;justify-content:center;gap:10px}
button.mic.listening{background:var(--warn);border-color:var(--warn);color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){button.mic.listening{animation:none}}
.heard{font-family:var(--font-mono);font-size:.92rem;color:var(--muted);min-height:1.3em;margin-top:8px;word-break:break-word}
.note{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:.9rem;margin-top:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:baseline}
tr:last-child td{border-bottom:0}
td.v{text-align:right;font-family:var(--font-mono);font-size:1.15rem;white-space:nowrap}
td.u{color:var(--muted);font-size:.85rem;width:5.5em;padding-left:8px}
tr.in td{color:var(--muted)}
tr.in td.v{font-size:1rem}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);
  border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart text{font-family:var(--font-mono);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .sat{stroke:var(--accent);stroke-width:2;fill:none}
.chart .pt{fill:var(--warn);stroke:var(--card);stroke-width:2}
.chart .guide{stroke:var(--warn);stroke-width:1;stroke-dasharray:3 3}
.speech-fallback{margin-top:10px}
</style>

<script>
// ===== Lõi tính toán psychrometric (ASHRAE Fundamentals, Hyland–Wexler) =====
(function (root) {
  'use strict';
  var P_STD = 101325;
  function pws(t) {
    var T = t + 273.15, ln;
    if (t < 0) ln = -5.6745359e3/T + 6.3925247 - 9.677843e-3*T + 6.2215701e-7*T*T + 2.0747825e-9*T*T*T - 9.484024e-13*T*T*T*T + 4.1635019*Math.log(T);
    else ln = -5.8002206e3/T + 1.3914993 - 4.8640239e-2*T + 4.1764768e-5*T*T - 1.4452093e-8*T*T*T + 6.5459673*Math.log(T);
    return Math.exp(ln);
  }
  function wFromPv(pv,p){return 0.621945*pv/(p-pv);}
  function pvFromW(w,p){return p*w/(0.621945+w);}
  function enthalpy(t,w){return 1.006*t + w*(2501+1.86*t);}
  function specVol(t,w,p){return 0.287042*(t+273.15)*(1+1.607858*w)/(p/1000);}
  function dewPointFromPv(pv){
    var a=Math.log(pv/1000), td=6.54+14.526*a+0.7389*a*a+0.09486*a*a*a+0.4569*Math.pow(pv/1000,0.1984);
    if(td<0) td=6.09+12.608*a+0.4959*a*a;
    for(var i=0;i<20;i++){var f=pws(td)-pv,d=(pws(td+0.01)-pws(td-0.01))/0.02,s=f/d;td-=s;if(Math.abs(s)<1e-7)break;}
    return td;
  }
  function wFromWetBulb(t,twb,p){
    var ws=wFromPv(pws(twb),p);
    if(twb>=0) return ((2501-2.326*twb)*ws-1.006*(t-twb))/(2501+1.86*t-4.186*twb);
    return ((2830-0.24*twb)*ws-1.006*(t-twb))/(2830+1.86*t-2.1*twb);
  }
  function wetBulb(t,w,p){
    var lo=dewPointFromPv(pvFromW(w,p)),hi=t; if(lo>hi)lo=hi-1e-6;
    for(var i=0;i<80;i++){var m=(lo+hi)/2; if(wFromWetBulb(t,m,p)>w)hi=m;else lo=m; if(hi-lo<1e-7)break;}
    return (lo+hi)/2;
  }
  function solve(t,kind,val,p){
    p=p||P_STD; var w,pvs=pws(t);
    switch(kind){
      case 'rh': w=wFromPv(val/100*pvs,p);break;
      case 'w': w=val/1000;break;
      case 'twb': w=wFromWetBulb(t,val,p);break;
      case 'tdp': w=wFromPv(pws(val),p);break;
      case 'h': w=(val-1.006*t)/(2501+1.86*t);break;
      default: throw new Error('kind');
    }
    if(w<0)w=0;
    var pv=pvFromW(w,p),rh=pv/pvs*100;
    return {t:t,rh:rh,w:w*1000,twb:wetBulb(t,w,p),tdp:w>0?dewPointFromPv(pv):NaN,h:enthalpy(t,w),v:specVol(t,w,p),pv:pv,pws:pvs,p:p,supersaturated:rh>100.0001};
  }
  root.Psychro={pws:pws,solve:solve,wFromPv:wFromPv,P_STD:P_STD};
})(window);

  var UNITS={t:'°C',rh:'%',w:'g/kg',twb:'°C',tdp:'°C',h:'kJ/kg',v:'m³/kg',pv:'kPa'};
  var SPOKEN_UNITS={t:'độ C',rh:'phần trăm',w:'gam trên kilôgam',twb:'độ C',tdp:'độ C',h:'kilôjun trên kilôgam',v:'mét khối trên kilôgam',pv:'kilôpascal'};
  var LABELS={rh:'Độ ẩm tương đối, %',w:'Độ chứa hơi, g/kg',twb:'Nhiệt độ bầu ướt, °C',tdp:'Nhiệt độ điểm sương, °C',h:'Entanpi, kJ/kg'};
  var DEC={t:1,rh:1,w:2,twb:1,tdp:1,h:1,v:3,pv:3};

  function fmt(x,d){return isFinite(x)?x.toFixed(d).replace('.',','):'—';}
  function fmtSpoken(x,d){return isFinite(x)?x.toFixed(d).replace('.',' phẩy '):'không xác định';}

  function compute(){
    var t=parseFloat($('t').value),kind=$('kind').value,val=parseFloat($('val').value),p=parseFloat($('p').value)*1000;
    if(!isFinite(t)||!isFinite(val)||!isFinite(p)||p<=0){show(null,'Hãy nhập đủ nhiệt độ bầu khô, thông số thứ hai và áp suất.');return null;}
    if(kind==='twb'&&val>t){show(null,'Nhiệt độ bầu ướt không thể lớn hơn nhiệt độ bầu khô.');return null;}
    if(kind==='tdp'&&val>t){show(null,'Nhiệt độ điểm sương không thể lớn hơn nhiệt độ bầu khô.');return null;}
    var r=Psychro.solve(t,kind,val,p);
    show(r,r.supersaturated?'Trạng thái vượt bão hoà (φ > 100 %), không tồn tại trong thực tế. Kết quả chỉ để tham khảo.':null,kind);
    return r;
  }

  function show(r,alertMsg,kind){
    var a=$('alert');a.hidden=!alertMsg;a.textContent=alertMsg||'';
    var tb=$('tbl').tBodies[0];tb.innerHTML='';
    if(!r){lastSentence='';drawChart(null);return;}
    var order=['t',kind,'rh','w','twb','tdp','h','v','pv'];
    var seen={};
    order.forEach(function(k){
      if(seen[k])return;seen[k]=true;
      var tr=document.createElement('tr'),isIn=(k==='t'||k===kind);
      if(isIn)tr.className='in';
      var val=k==='pv'?r.pv/1000:r[k];
      tr.innerHTML='<td>'+NAMES[k]+(isIn?'<span class="tag">đã cho</span>':'')+'</td><td class="v">'+fmt(val,DEC[k])+'</td><td class="u">'+UNITS[k]+'</td>';
      tb.appendChild(tr);
    });
    // Câu đọc
    var outs=['rh','w','twb','tdp','h'].filter(function(k){return k!==kind;});
    lastSentence='Với '+NAMES.t.toLowerCase()+' '+fmtSpoken(r.t,1)+' '+SPOKEN_UNITS.t+' và '+NAMES[kind].toLowerCase()+' '+fmtSpoken(r[kind],DEC[kind])+' '+SPOKEN_UNITS[kind]+': '
      +outs.map(function(k){return NAMES[k].toLowerCase()+' '+fmtSpoken(r[k],DEC[k])+' '+SPOKEN_UNITS[k];}).join('; ')+'.'
      +(r.supersaturated?' Lưu ý: trạng thái vượt bão hoà, không hợp lệ.':'');
    drawChart(r);
  }

  // ===== Đồ thị d–t nhỏ: đường bão hoà và điểm trạng thái =====
  function drawChart(r){
    var svg=$('chart');svg.innerHTML='';
    var p=r?r.p:Psychro.P_STD;
    var tMin=-10,tMax=50,wMax=30; if(r&&r.t>45)tMax=Math.ceil(r.t/10)*10+5; if(r&&r.w>26)wMax=Math.ceil(r.w/10)*10+5;
    var L=38,R=392,T=12,B=228;
    var X=function(t){return L+(t-tMin)/(tMax-tMin)*(R-L);},Y=function(w){return B-w/wMax*(B-T);};
    var s='';
    for(var t=tMin;t<=tMax;t+=10){s+='<line class="grid" x1="'+X(t)+'" y1="'+T+'" x2="'+X(t)+'" y2="'+B+'"/><text x="'+X(t)+'" y="'+(B+16)+'" text-anchor="middle">'+t+'</text>';}
    for(var w=0;w<=wMax;w+=5){s+='<line class="grid" x1="'+L+'" y1="'+Y(w)+'" x2="'+R+'" y2="'+Y(w)+'"/><text x="'+(L-4)+'" y="'+(Y(w)+4)+'" text-anchor="end">'+w+'</text>';}
    s+='<text x="'+R+'" y="'+(B+30)+'" text-anchor="end">t bầu khô, °C</text><text x="'+(L+4)+'" y="'+(T+10)+'">d, g/kg</text>';
    var d='';
    for(var tt=tMin;tt<=tMax;tt+=0.5){var ws=Psychro.wFromPv(Psychro.pws(tt),p)*1000;if(ws>wMax*1.02)break;d+=(d?' L':'M')+X(tt).toFixed(1)+' '+Y(ws).toFixed(1);}
    s+='<path class="sat" d="'+d+'"/>';
    if(r&&r.t>=tMin&&r.t<=tMax&&r.w<=wMax){
      var x=X(r.t),y=Y(r.w);
      s+='<line class="guide" x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+B+'"/><line class="guide" x1="'+L+'" y1="'+y+'" x2="'+x+'" y2="'+y+'"/>';
      if(isFinite(r.tdp))s+='<circle class="pt" r="4" cx="'+X(r.tdp)+'" cy="'+y+'" opacity=".6"/>';
      s+='<circle class="pt" r="6" cx="'+x+'" cy="'+y+'"/>';
    }
    svg.innerHTML=s;
  }

  // ===== Phân tích câu nói tiếng Việt =====
  function strip(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');}
  var ONES={'mot':1,'hai':2,'ba':3,'bon':4,'nam':5,'lam':5,'sau':6,'bay':7,'tam':8,'chin':9};
  function textToDigits(s){
    // "hai lam" => 25 ; "muoi" sau số đơn: "ba muoi" ; "ba lam"=35 (lăm chỉ đứng sau hàng chục)
    var t=s.split(/\s+/),out=[],i=0;
    while(i<t.length){
      if(ONES.hasOwnProperty(t[i])||t[i]==='muoi'||t[i]==='tram'){
        // xử lý "X lam"/"X muoi Y"
        var seq=[];var j=i;
        while(j<t.length&&(ONES.hasOwnProperty(t[j])||['muoi','tram','linh','le','nghin','ngan'].indexOf(t[j])>=0)){seq.push(t[j]);j++;}
        var v=parseSeq(seq);
        if(v!==null){out.push(String(v));i=j;continue;}
      }
      out.push(t[i]);i++;
    }
    return out.join(' ');
  }
  function parseSeq(seq){
    var total=0,hund=0,tens=0,ones=0,i=0,any=false;
    while(i<seq.length){
      var w=seq[i],nx=seq[i+1];
      if(w==='nghin'||w==='ngan'){total+=(hund+tens+ones||1)*1000;hund=tens=ones=0;any=true;i++;continue;}
      if(w==='tram'){hund=(ones||1)*100;ones=0;any=true;i++;continue;}
      if(w==='muoi'){tens=ones?ones*10:10;ones=0;any=true;i++;continue;}   // "ba muoi", "muoi"
      if(w==='linh'||w==='le'){i++;continue;}
      if(ONES.hasOwnProperty(w)){
        if(nx==='muoi'){tens=ONES[w]*10;i+=2;any=true;continue;}
        if(nx==='lam'&&!tens&&w!=='khong'){tens=ONES[w]*10;ones=5;i+=2;any=true;continue;} // "hai lam" = 25
        ones=ONES[w];any=true;i++;continue;
      }
      break;
    }
    return any?total+hund+tens+ones:null;
  }

  var KEYS=[
    {k:'t',re:/(?:nhiet do )?bau kho|nhiet do kho|dry bulb/},
    {k:'twb',re:/(?:nhiet do )?bau uot|nhiet do uot|wet bulb/},
    {k:'tdp',re:/diem suong|dew ?point|dong suong/},
    {k:'w',re:/do chua hoi|do chua am|ham luong am|humidity ratio|luong chua am/},
    {k:'h',re:/en ?tan ?pi|enthalpy|entalpi|en ?tal ?py|nhiet ham/},
    {k:'rh',re:/do am(?: tuong doi)?|phi|relative humidity|humidity/},
    {k:'p',re:/ap suat/}
  ];
  var NUM=/(am|tru)?\s*(\d+(?:[.,]\d+)?)\s*(do c|do|phan tram|%|gam|g\/kg|gram|kilo ?jun|kj|kpa|kilo ?pascal|mi ?li ?bar|mbar|pa)?/g;

  function parseSpeech(raw){
    var s=strip(raw).replace(/(\d),(\d)/g,'$1.$2').replace(/\bphay\b|\bcham\b/g,'.').replace(/(\d)\s*\.\s*(\d)/g,'$1.$2');
    s=textToDigits(s);
    s=s.replace(/(?<!do )\bam\s+(\d)/g,'-$1').replace(/\btru\s+(\d)/g,'-$1');
    // Tìm vị trí từ khoá
    var keys=[];
    KEYS.forEach(function(K){var re=new RegExp(K.re.source,'g'),m;while((m=re.exec(s))){keys.push({k:K.k,pos:m.index,end:m.index+m[0].length});}});
    // "do am" cũng khớp trong "do chua hoi"? không. Nhưng "nhiet do" không phải từ khoá -> ok. Loại rh trùng vị trí với từ khoá khác.
    keys=keys.filter(function(a){return !keys.some(function(b){return b!==a&&b.k!==a.k&&a.pos>=b.pos&&a.end<=b.end;});});
    keys.sort(function(a,b){return a.pos-b.pos;});
    var nums=[],re=/(-?\d+(?:\.\d+)?)\s*(do c|do|phan tram|%|gam|g\/kg|gram|kilo ?jun|kj|kpa|kilo ?pascal|mbar|pa)?/g,m;
    while((m=re.exec(s))){nums.push({v:parseFloat(m[1]),unit:m[2]||'',pos:m.index,used:false});}
    var got={};
    // Mỗi từ khoá lấy số gần nhất phía sau (trước từ khoá kế tiếp), nếu không có thì số ngay trước.
    keys.forEach(function(K,i){
      var limit=i+1<keys.length?keys[i+1].pos:Infinity;
      var n=nums.find(function(x){return !x.used&&x.pos>=K.end&&x.pos<limit;});
      if(!n){var before=nums.filter(function(x){return !x.used&&x.pos<K.pos;});n=before[before.length-1];}
      if(n){n.used=true;if(got[K.k]===undefined)got[K.k]=n.v;}
    });
    // Suy từ đơn vị cho số chưa dùng
    nums.filter(function(x){return !x.used;}).forEach(function(n){
      var u=n.unit;
      if(/phan tram|%/.test(u)&&got.rh===undefined){got.rh=n.v;n.used=true;}
      else if(/gam|g\/kg|gram/.test(u)&&got.w===undefined){got.w=n.v;n.used=true;}
      else if(/jun|kj/.test(u)&&got.h===undefined){got.h=n.v;n.used=true;}
      else if(/kpa|pascal|mbar|pa/.test(u)&&got.p===undefined){got.p=n.v;n.used=true;}
    });
    var rest=nums.filter(function(x){return !x.used;});
    if(got.t===undefined&&rest.length){got.t=rest.shift().v;}
    var second=['rh','w','twb','tdp','h'].filter(function(k){return got[k]!==undefined;});
    if(!second.length&&rest.length){got.rh=rest.shift().v;second=['rh'];}
    if(got.t===undefined||!second.length)return null;
    return {t:got.t,kind:second[0],val:got[second[0]],p:got.p};
  }

  // ===== Giọng nói: cầu nối Android hoặc Web Speech API =====
  var android=window.AndroidBridge; // do WebView Android cung cấp
  var rec=null,listening=false;
  function setListening(on){listening=on;var b=$('mic');b.classList.toggle('listening',on);b.textContent=on?'● Đang nghe… (nhấn để dừng)':'🎤 Nhấn và nói';}

  function speak(text){
    if(!text)return;
    if(android&&android.speak){android.speak(text);return;}
    if('speechSynthesis'in window){
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.rate=1;
      var vs=window.speechSynthesis.getVoices().filter(function(v){return /^vi/i.test(v.lang);});if(vs.length)u.voice=vs[0];
      window.speechSynthesis.speak(u);
    }
  }
  function stopSpeak(){if(android&&android.stopSpeak)android.stopSpeak();else if('speechSynthesis'in window)window.speechSynthesis.cancel();}

  // Kết quả nhận dạng (gọi từ Android hoặc Web Speech)
  window.onSpeechResult=function(text){
    setListening(false);
    $('heard').textContent='Nghe được: '+text;
    var r=parseSpeech(text);
    if(!r){var msg='Chưa hiểu câu này. Hãy nói nhiệt độ bầu khô và một thông số nữa, ví dụ: bầu khô 30 độ, độ ẩm 60 phần trăm.';$('heard').textContent+=' — chưa hiểu';speak(msg);return;}
    $('heard').textContent='Nghe được: '+text+'  →  Tính với: bầu khô '+fmt(r.t,1)+' °C; '+NAMES[r.kind].toLowerCase()+' '+fmt(r.val,DEC[r.kind])+' '+UNITS[r.kind]+(r.p!==undefined?'; áp suất '+r.p:'');
    $('t').value=r.t;$('kind').value=r.kind;$('val').value=r.val;if(r.p!==undefined){$('p').value=r.p>2000?r.p/1000:r.p;}
    $('valLabel').textContent=LABELS[r.kind];
    if(compute())speak(lastSentence);
  };
  window.onSpeechError=function(msg){setListening(false);$('heard').textContent='Không nghe được: '+msg;};
  window.onSpeechStarted=function(){setListening(true);$('heard').textContent='Đang nghe…';};

  function startListening(){
    stopSpeak();
    if(android&&android.startListening){android.startListening('vi-VN');setListening(true);return;}
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){$('fallback').hidden=false;$('heard').textContent='Trình duyệt này không hỗ trợ nhận dạng giọng nói. Hãy gõ câu lệnh ở ô bên dưới hoặc dùng bản APK.';$('txt').focus();return;}
    try{
      rec=new SR();rec.lang='vi-VN';rec.interimResults=false;rec.maxAlternatives=1;
      rec.onstart=window.onSpeechStarted;
      rec.onresult=function(e){window.onSpeechResult(e.results[0][0].transcript);};
      rec.onerror=function(e){window.onSpeechError(e.error==='not-allowed'?'không được cấp quyền micro (dùng bản APK hoặc gõ câu lệnh)':e.error);$('fallback').hidden=false;};
      rec.onend=function(){setListening(false);};
      rec.start();
    }catch(err){window.onSpeechError(String(err));$('fallback').hidden=false;}
  }
  function stopListening(){if(android&&android.stopListening)android.stopListening();else if(rec){try{rec.stop();}catch(e){}}setListening(false);}

  $('mic').addEventListener('click',function(){listening?stopListening():startListening();});
  $('calc').addEventListener('click',function(){compute();});
  $('speak').addEventListener('click',function(){if(!lastSentence)compute();speak(lastSentence);});
  $('stop').addEventListener('click',function(){stopSpeak();stopListening();});
  $('kind').addEventListener('change',function(){$('valLabel').textContent=LABELS[this.value];compute();});
  ['t','val','p'].forEach(function(id){$(id).addEventListener('input',function(){compute();});});
  $('txt').addEventListener('keydown',function(e){if(e.key==='Enter'){window.onSpeechResult(this.value);}});
  if('speechSynthesis'in window)window.speechSynthesis.onvoiceschanged=function(){};
  $('valLabel').textContent=LABELS[$('kind').value];
  compute();
  window.__parseSpeech=parseSpeech; // để kiểm thử
})();
</script>
